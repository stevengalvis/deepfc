name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            experiments/joint_strength_requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" -r experiments/joint_strength_requirements.txt
      - run: python -m pytest

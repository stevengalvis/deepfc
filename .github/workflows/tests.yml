name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stevengalvis/modelfc
          ref: 06cf7c0d84ca671c3e1a0d0ba57ab050b3f5164a
          path: .zeno-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests experiments/test_compare_team_corners.py
        env:
          PYTHONPATH: .zeno-reference/src

name: Independent review artifacts

on:
  push:
    branches:
      - research/deepfc-independent-review-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            experiments/joint_strength_requirements.txt
            experiments/independent_review/reliability/requirements.txt
      - run: python -m pip install -e ".[test]" -r experiments/joint_strength_requirements.txt -r experiments/independent_review/reliability/requirements.txt
      - run: python -m pip check
      - name: Existing and home slope synthetic tests
        env:
          PYTHONPATH: src:.:experiments/independent_review/home_slope
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest -q tests experiments/independent_review/home_slope/test_home_slope.py
      - name: Reproduce derived evidence without historical fitting
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python experiments/independent_review/verify_artifacts.py
